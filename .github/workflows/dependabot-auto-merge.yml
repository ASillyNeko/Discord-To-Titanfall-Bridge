name: dependabot-auto-merge

# Only runs if the user is dependabot[bot]
on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  auto-merge:
    if: github.repository == 'ASillyNeko/Discord-To-Titanfall-Bridge' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ASILLYNEKO_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ASILLYNEKO_BOT_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh pr merge --auto -s "$PR_URL"
